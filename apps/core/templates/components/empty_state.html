{# with icon title text action_label action_url error(bool) #}
<div class="empty{% if error %} empty--error{% endif %}">
  <div class="empty__icon">{% include "components/icon.html" with name=icon|default:'inbox' %}</div>
  <h3 class="empty__title">{{ title }}</h3>
  {% if text %}<p class="empty__text">{{ text }}</p>{% endif %}
  {% if action_label %}<div class="empty__actions"><a class="btn btn--primary" href="{{ action_url }}">{{ action_label }}</a></div>{% endif %}
</div>
